name: Deploy BudgetWise to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  

jobs:
  deploy:
    name: Deploy BudgetWise to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 457335975306.dkr.ecr.us-east-2.amazonaws.com
          ECR_REPOSITORY: budgetbuddy_app
          IMAGE_TAG: latest
        run: |
          docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: 457335975306.dkr.ecr.us-east-2.amazonaws.com
          ECR_REPOSITORY: budgetbuddy_app
          IMAGE_TAG: latest
          COMPOSE_PATH: /home/${{ secrets.EC2_USER }}/app/ai-chat-platform/budgetbuddy-docker-compose.yml
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            set -e

            echo "Logging in to ECR..."
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            echo "Pulling latest image..."
            docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

            echo "Starting containers with Docker Compose..."
            docker compose -f ${COMPOSE_PATH} up -d

            echo "Running database migrations..."
            docker exec budgetbuddy_app npm run db:push
            
            echo "Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            echo "Checking container status..."
            docker ps --filter "name=budgetbuddy_app"
          ENDSSH
