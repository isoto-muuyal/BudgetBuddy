services:
  budgetbuddy:
    build: .
    container_name: budgetbuddy_app
    restart: always
    ports:
      - "127.0.0.1:5003:5003" 
    env_file: .env
    environment:
      - PORT=5003
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_VISITS_CSV_PATH=/app/data/visits.csv
    volumes:
      - ./data:/app/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true
